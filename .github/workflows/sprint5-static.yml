name: Sprint 5 Static Validation

on:
  push:
    branches:
      - sprint-5
  pull_request:
    branches:
      - sprint-5

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Core static contract
        run: python tests/static_validate.py

      - name: Sprint 5 visual contract
        run: python tests/static_validate_sprint5.py

      - name: Player Feel contract
        run: python tests/static_validate_player_feel.py

      - name: External asset pipeline contract
        run: python tests/static_validate_asset_pipeline.py

      - name: House planning contract
        run: python tests/static_validate_house_plan.py

      - name: Character readability preview contract
        run: python tests/static_validate_character_preview.py

      - name: Sprint 5 TSCN resource contract
        run: python tests/static_validate_sprint5_scenes.py

      - name: Sound production catalog contract
        run: python tests/static_validate_sound_catalog.py

      - name: HUD UX contract
        run: python tests/static_validate_hud_ux.py

      - name: Interaction planning contract
        run: python tests/static_validate_interaction_planning.py

      - name: Audio memory design contract
        run: python tests/static_validate_audio_memory_design.py

      - name: P0 sound production matrix contract
        run: python tests/static_validate_p0_sound_matrix.py

      - name: P0 sound acquisition order contract
        run: python tests/static_validate_p0_sound_acquisition.py

      - name: Cassette memory design contract
        run: python tests/static_validate_cassette_memory_design.py

      - name: PISTE 0 narrative beat contract
        run: python tests/static_validate_piste0_narrative_design.py

      - name: Guidance/recovery design contract
        run: python tests/static_validate_guidance_recovery_design.py

      - name: PISTE 0 pacing design contract
        run: python tests/static_validate_piste0_pacing_design.py
